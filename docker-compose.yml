services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - 5432:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
        - -U
        - ${POSTGRES_USER}
        - -d
        - ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  # Apex API Service
  api:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      API_PORT: 3000
      NODE_ENV: production
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/usr/src/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --f
        - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Scraper Service (separate from API)
  scraper:
    build: .
    command:
      - node
      - dist/consolidated-scraper.js
    environment:
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      SCRAPE_YEAR: 2024
      START_RACE: 1
      END_RACE: 36
      INCREMENTAL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/usr/src/app/logs
    restart: "no"  # Run once, don't restart
    profiles:
      - scraping  # Only start with --profile scraping

  # Crawl4AI Server
  crawl4ai:
    image: python:3.12-slim
    container_name: apex_crawl4ai
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt && python crawl4ai_server.py"
    ports:
      - 11235:11235
    volumes:
      - ./crawl4ai_server.py:/app/crawl4ai_server.py
      - ./requirements.txt:/app/requirements.txt
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import requests; requests.get('http://localhost:11235/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

volumes:
  postgres_data:
