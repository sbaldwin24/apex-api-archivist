# Redis Configuration for NASCAR API Production
# Optimized for containerized deployment with security and performance tuning

# -----------------------------------------------------------------------------
# NETWORK AND CONNECTION SETTINGS
# -----------------------------------------------------------------------------

# Bind to all interfaces (container networking)
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Security
protected-mode yes
# requirepass will be set via environment variable

# -----------------------------------------------------------------------------
# MEMORY MANAGEMENT
# -----------------------------------------------------------------------------

# Memory policy
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# -----------------------------------------------------------------------------
# PERSISTENCE SETTINGS
# -----------------------------------------------------------------------------

# RDB snapshots
save 900 1    # Save if at least 1 key changed in 900 seconds
save 300 10   # Save if at least 10 keys changed in 300 seconds  
save 60 10000 # Save if at least 10000 keys changed in 60 seconds

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF (Append Only File) persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

# Log level: debug, verbose, notice, warning
loglevel notice
logfile ""
syslog-enabled no

# -----------------------------------------------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------------------------------------------

# Latency monitoring
latency-monitor-threshold 100

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Hash table rehashing
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# -----------------------------------------------------------------------------
# SECURITY SETTINGS
# -----------------------------------------------------------------------------

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Enable keyspace notifications for monitoring
notify-keyspace-events Ex

# -----------------------------------------------------------------------------
# CLIENT SETTINGS  
# -----------------------------------------------------------------------------

# Client limits
maxclients 10000
tcp-keepalive 300

# Output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# -----------------------------------------------------------------------------
# REPLICATION (for future use)
# -----------------------------------------------------------------------------

# Replica settings (uncomment when using replication)
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no
# repl-diskless-sync-delay 5
# replica-priority 100

# -----------------------------------------------------------------------------
# MODULES AND EXTENSIONS
# -----------------------------------------------------------------------------

# Load modules (uncomment as needed)
# loadmodule /usr/lib/redis/modules/redisearch.so
# loadmodule /usr/lib/redis/modules/redistimeseries.so

# -----------------------------------------------------------------------------
# ADVANCED SETTINGS
# -----------------------------------------------------------------------------

# Hash table sizing
databases 16

# Lua scripting
lua-time-limit 5000

# HyperLogLog
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# Client query buffer
client-query-buffer-limit 1gb

# Protocol buffer
proto-max-bulk-len 512mb

# Background tasks
hz 10

# Dynamic HZ
dynamic-hz yes

# Active defragmentation (Redis 4.0+)
# Uncomment to enable memory defragmentation
# activedefrag yes
# active-defrag-ignore-bytes 100mb  
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100
# active-defrag-cycle-min 5
# active-defrag-cycle-max 75

# -----------------------------------------------------------------------------
# MONITORING AND STATS
# -----------------------------------------------------------------------------

# Statistics
always-show-logo no

# -----------------------------------------------------------------------------
# CONTAINER-SPECIFIC SETTINGS
# -----------------------------------------------------------------------------

# Disable supervised mode (let container orchestrator handle)
supervised no

# Directory for data files (mounted volume)
dir /data

# Use less memory for small datasets
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Optimize for container environment
daemonize no
pidfile /var/run/redis_6379.pid
