# PostgreSQL Configuration for NASCAR API Production
# Optimized for containerized deployment with performance tuning

# -----------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
# -----------------------------------------------------------------------------

# Connection settings
max_connections = 200
superuser_reserved_connections = 3

# Authentication
authentication_timeout = 1min

# SSL configuration (enable when certificates are available)
#ssl = on
#ssl_cert_file = 'server.crt'
#ssl_key_file = 'server.key'

# -----------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
# -----------------------------------------------------------------------------

# Memory settings (adjust based on container memory limits)
shared_buffers = 512MB                    # 25% of RAM
effective_cache_size = 1536MB             # 75% of RAM  
work_mem = 8MB                            # Per connection working memory
maintenance_work_mem = 128MB              # Maintenance operations
max_stack_depth = 2MB

# Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# Asynchronous behavior
effective_io_concurrency = 200            # For SSDs
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# -----------------------------------------------------------------------------
# WRITE AHEAD LOG
# -----------------------------------------------------------------------------

# WAL configuration
wal_level = replica
wal_compression = on
wal_buffers = 16MB
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# Checkpoint configuration
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 1GB
checkpoint_flush_after = 256kB

# Archiving (enable for backup/replication)
#archive_mode = on
#archive_command = 'test ! -f /backups/%f && cp %p /backups/%f'

# -----------------------------------------------------------------------------
# REPLICATION
# -----------------------------------------------------------------------------

# Streaming replication settings (uncomment if using replicas)
#max_wal_senders = 10
#wal_keep_segments = 32
#hot_standby = on
#hot_standby_feedback = on

# -----------------------------------------------------------------------------
# QUERY TUNING
# -----------------------------------------------------------------------------

# Query planner
random_page_cost = 1.1                    # SSD-optimized
effective_cache_size = 1536MB
default_statistics_target = 100
constraint_exclusion = partition

# Query execution
shared_preload_libraries = 'pg_stat_statements'
max_locks_per_transaction = 256

# -----------------------------------------------------------------------------
# ERROR REPORTING AND LOGGING
# -----------------------------------------------------------------------------

# Logging configuration
log_destination = 'stderr'
logging_collector = off                   # Let Docker handle logs
log_min_messages = info
log_min_error_statement = error
log_min_duration_statement = 1000        # Log slow queries (1 second+)

# Log format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0
log_error_verbosity = default

# Statement logging
log_statement = 'none'                   # Don't log all statements
log_duration = off
log_hostname = on

# -----------------------------------------------------------------------------
# RUNTIME STATISTICS
# -----------------------------------------------------------------------------

# Query and index statistics collector
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
stats_temp_directory = 'pg_stat_tmp'

# Statement statistics (requires pg_stat_statements)
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on

# -----------------------------------------------------------------------------
# AUTOVACUUM PARAMETERS
# -----------------------------------------------------------------------------

# Autovacuum settings
autovacuum = on
log_autovacuum_min_duration = 0
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 200

# -----------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# -----------------------------------------------------------------------------

# Locale and formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# Application-specific settings
statement_timeout = 30s                  # Prevent runaway queries
idle_in_transaction_session_timeout = 5min
lock_timeout = 5s

# -----------------------------------------------------------------------------
# SECURITY AND ACCESS CONTROL
# -----------------------------------------------------------------------------

# Security settings
row_security = on
ssl_prefer_server_ciphers = on
password_encryption = scram-sha-256

# Connection security
tcp_keepalives_idle = 600                # 10 minutes
tcp_keepalives_interval = 30             # 30 seconds
tcp_keepalives_count = 3

# -----------------------------------------------------------------------------
# PERFORMANCE MONITORING
# -----------------------------------------------------------------------------

# Enable extensions for monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# JIT compilation (PostgreSQL 11+)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# -----------------------------------------------------------------------------
# CONTAINER-SPECIFIC OPTIMIZATIONS
# -----------------------------------------------------------------------------

# Disable features not needed in containers
full_page_writes = off                   # Safe with modern filesystems
synchronous_commit = off                 # Performance boost (small data loss risk)
fsync = on                              # Keep enabled for data integrity
wal_sync_method = fdatasync             # Efficient sync method

# Parallel processing
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0
max_parallel_workers_per_gather = 2

# Hash joins and sorts
hash_mem_multiplier = 1.0
maintenance_work_mem = 128MB
